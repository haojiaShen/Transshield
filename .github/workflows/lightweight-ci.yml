name: Lightweight CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lightweight-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lightweight.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lightweight.txt
      - run: python -m compileall -q showcase_api tests tools
      - run: python -m unittest discover -s tests -v
      - run: python tools/split_gateway_smoke.py
      - run: python tools/run_showcase_lightweight_checks.py

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - run: npm ci
      - run: npm run build
