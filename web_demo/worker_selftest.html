<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transshield Worker Selftest</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #f6f7fb; color: #101827; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      button, input { font: inherit; }
      button { padding: 10px 14px; border-radius: 10px; border: 1px solid #c8d0e0; background: #fff; cursor: pointer; }
      pre { background: #0f172a; color: #e2e8f0; padding: 16px; border-radius: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Worker Selftest</h1>
    <div class="row">
      <button id="pngBomb">超大 PNG 头部</button>
      <button id="badJpeg">畸形 JPEG</button>
      <button id="truncatedWebp">截断 WebP</button>
      <button id="repeatValid">小图连续运行 100 次</button>
      <input id="fileInput" type="file" accept="image/*" />
      <button id="runFile">运行选中文件</button>
    </div>
    <pre id="log">ready</pre>
    <script>
      const logBox = document.getElementById('log');
      const fileInput = document.getElementById('fileInput');

      function appendLog(message) {
        logBox.textContent += `\n${message}`;
      }

      function onceWithWorker(buffer, fileType = 'image/png') {
        return new Promise((resolve) => {
          const worker = new Worker('/control_plane_worker.js');
          worker.onmessage = (event) => {
            resolve(event.data);
            worker.terminate();
          };
          worker.onerror = (event) => {
            resolve({ ok: false, error_code: 'worker_crashed', message: event.message });
            worker.terminate();
          };
          worker.postMessage({ type: 'medical-run', fileBuffer: buffer, fileType }, [buffer]);
        });
      }

      function fakePngBomb() {
        const bytes = new Uint8Array(32);
        bytes.set([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a], 0);
        bytes.set([0x00, 0x00, 0x00, 0x0d], 8);
        bytes.set([0x49, 0x48, 0x44, 0x52], 12);
        const view = new DataView(bytes.buffer);
        view.setUint32(16, 50000, false);
        view.setUint32(20, 50000, false);
        return bytes.buffer;
      }

      function fakeBadJpeg() {
        return new Uint8Array([0xff, 0xd8, 0xff, 0xc0, 0x00, 0x03, 0x08]).buffer;
      }

      function fakeTruncatedWebp() {
        const bytes = new Uint8Array(20);
        bytes.set([0x52, 0x49, 0x46, 0x46], 0);
        bytes.set([0x57, 0x45, 0x42, 0x50], 8);
        bytes.set([0x56, 0x50, 0x38, 0x58], 12);
        return bytes.buffer;
      }

      document.getElementById('pngBomb').onclick = async () => {
        appendLog(JSON.stringify(await onceWithWorker(fakePngBomb(), 'image/png')));
      };
      document.getElementById('badJpeg').onclick = async () => {
        appendLog(JSON.stringify(await onceWithWorker(fakeBadJpeg(), 'image/jpeg')));
      };
      document.getElementById('truncatedWebp').onclick = async () => {
        appendLog(JSON.stringify(await onceWithWorker(fakeTruncatedWebp(), 'image/webp')));
      };
      document.getElementById('repeatValid').onclick = async () => {
        const file = fileInput.files[0];
        if (!file) {
          appendLog('请选择一张合法图片后再做连续运行测试。');
          return;
        }
        for (let index = 0; index < 100; index += 1) {
          const buffer = await file.arrayBuffer();
          const result = await onceWithWorker(buffer, file.type);
          if (!result.ok) {
            appendLog(`repeat #${index + 1}: ${JSON.stringify(result)}`);
            return;
          }
        }
        appendLog('repeat #100: all passed');
      };
      document.getElementById('runFile').onclick = async () => {
        const file = fileInput.files[0];
        if (!file) {
          appendLog('请选择图片。');
          return;
        }
        const result = await onceWithWorker(await file.arrayBuffer(), file.type);
        appendLog(JSON.stringify(result));
      };
    </script>
  </body>
</html>
